
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Automation Run Matrix History Hub</title>
    <style>
        :root {
            --bg: #e6f2dd;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #4b5563;
            --accent: #659287;
            --accent-soft: #88bda4;
            --border: #d9e7d4;
            --success: #2f855a;
            --warning: #d69e2e;
            --danger: #c53030;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg) 0%, #f8fafc 100%);
            color: var(--text);
            padding: 40px;
            margin: 0;
        }

        .wrapper {
            max-width: 1180px;
            margin: 0 auto;
        }

        .hero {
            background: #f2f7ef;
            border: 1px solid rgba(101, 146, 135, 0.28);
            border-radius: 24px;
            padding: 28px 32px;
            margin-bottom: 28px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0;
            color: var(--text);
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.6px;
        }

        .hero p {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .hero strong {
            color: var(--text);
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(101, 146, 135, 0.18);
        }

        thead tr {
            background: linear-gradient(90deg, var(--accent-soft), #ffffff);
        }

        th {
            color: #2f4858;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 18px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(101, 146, 135, 0.15);
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(101, 146, 135, 0.10);
            font-size: 14px;
            color: var(--text);
        }

        tbody tr {
            transition: transform 0.2s, background 0.2s;
        }

        .clickable-row {
            cursor: pointer;
        }

        .clickable-row:hover {
            background: rgba(136, 189, 164, 0.16);
            transform: translateY(-1px);
        }

        td:nth-child(3) {
            color: var(--accent);
            font-weight: 700;
        }

        td:nth-child(5), td:nth-child(6), td:nth-child(7) {
            font-weight: 600;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 72px;
            padding: 6px 10px;
            border-radius: 999px;
            color: var(--surface);
            font-size: 12px;
            font-weight: 700;
        }

        .status-broken { background: rgba(197, 48, 48, 0.12); color: var(--danger); }
        .status-fixed { background: rgba(47, 133, 90, 0.12); color: var(--success); }

        @media (max-width: 980px) {
            body { padding: 24px; }
            .hero { padding: 24px; }
            th, td { padding: 14px 16px; }
        }

        @media (max-width: 720px) {
            .wrapper { padding: 0 12px; }
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { margin-bottom: 18px; border-radius: 18px; overflow: hidden; background: var(--surface); box-shadow: 0 18px 30px rgba(15, 23, 42, 0.06); }
            td { display: flex; justify-content: space-between; padding: 14px 16px; border-bottom: none; }
            td::before { content: attr(data-label); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 14px; flex: 1; }
            td:last-child { border-bottom: 0; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="hero">
            <h1>History Hub</h1>
            <p>Dashboard target host: <strong>lbb_in</strong></p>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Date & Time</th>
                    <th>Site</th>
                    <th>Device</th>
                    <th>Total Pages</th>
                    <th>Broken Pages</th>
                    <th>A11y Violations</th>
                    <th>SEO Score</th>
                </tr>
            </thead>
            <tbody>
                
      <tr class="clickable-row" data-href="report_28ZV6.html">
          <td style="padding: 16px; font-size: 14px; color: #475569;">7/24/2026, 1:19:57 PM</td>
          <td style="padding: 16px; font-size: 14px; font-weight: 600; color: #0f172a;">https://lbb.in/</td>
          <td style="padding: 16px; font-size: 13px; font-weight: 700; color: #2563eb;">MOBILE</td>
          <td data-label="Pages" style="padding: 16px; font-size: 14px; color: #475569;">5 pages</td>
          <td data-label="Broken" style="padding: 16px; font-size: 14px; color: #dc2626; font-weight: 600;">1</td>
          <td data-label="A11y" style="padding: 16px; font-size: 14px; color: #dc2626; font-weight: 600;">639</td>
          <td data-label="SEO" style="padding: 16px; font-size: 14px; color: #ca8a04; font-weight: 600;">68/100</td>
      </tr>
      <tr class="clickable-row" data-href="report_8THKE.html">
          <td style="padding: 16px; font-size: 14px; color: #475569;">7/24/2026, 1:08:48 PM</td>
          <td style="padding: 16px; font-size: 14px; font-weight: 600; color: #0f172a;">https://lbb.in/</td>
          <td style="padding: 16px; font-size: 13px; font-weight: 700; color: #2563eb;">DESKTOP</td>
          <td data-label="Pages" style="padding: 16px; font-size: 14px; color: #475569;">15 pages</td>
          <td data-label="Broken" style="padding: 16px; font-size: 14px; color: #475569; font-weight: normal;">0</td>
          <td data-label="A11y" style="padding: 16px; font-size: 14px; color: #dc2626; font-weight: 600;">2188</td>
          <td data-label="SEO" style="padding: 16px; font-size: 14px; color: #ca8a04; font-weight: 600;">85/100</td>
      </tr>
            </tbody>
        </table>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const rows = document.querySelectorAll('.clickable-row');
            rows.forEach(function(row) {
                row.addEventListener('click', function() {
                    const destination = this.getAttribute('data-href');
                    if (destination) { window.location.href = destination; }
                });
            });
        });
    </script>
</body>
</html>
